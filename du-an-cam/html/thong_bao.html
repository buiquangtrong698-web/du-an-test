      <main class="main">
        <header class="topbar">
        <button class="mobile-menu" type="button" aria-label="Mở menu">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
          <div>
            <h1>Thông báo</h1>
          </div>
        </header>
        <div class="content">
          <div class="page-heading notification-page-heading">
            <div>
            <span class="section-kicker">TRUNG TÂM THÔNG BÁO</span>
              <h2>Thông báo gần đây</h2>
              <p>Cập nhật mới nhất từ cộng đồng của bạn.</p>
            </div>
          <span class="notification-count" id="notificationCount" aria-live="polite" hidden></span>
          </div>
          <div class="notification-toolbar">
            <div class="notification-filter-group" role="group" aria-label="Lọc thông báo">
            <button class="notification-filter is-active" type="button" id="allNotificationsFilter" aria-pressed="true">
              Tất cả <span class="notification-filter-count" id="allNotificationCount">0</span>
            </button>
            <button class="notification-filter" type="button" id="unreadNotificationsFilter" aria-pressed="false">
              Chưa đọc <span class="notification-filter-count" id="unreadNotificationCount">0</span>
            </button>
          </div>
          <button class="notification-mark-all" type="button" id="markAllNotificationsRead" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
            Đọc tất cả
          </button>
          </div>
          <p class="notification-action-status" id="notificationActionStatus" role="status" aria-live="polite"></p>
          <div class="notification-list" id="notificationList" aria-live="polite"></div>
          <div class="notification-empty" id="notificationEmpty" role="status">
            <div class="notification-empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
          </div>
            <h3>Chưa có thông báo</h3>
            <p>Thông báo mới sẽ xuất hiện tại đây.</p>
          </div>
          <div class="modal-backdrop notification-detail-backdrop" id="notificationDetailModal" aria-hidden="true">
            <section class="modal notification-detail-modal" role="dialog" aria-modal="true" aria-labelledby="notificationDetailTitle">
              <div class="notification-detail-header">
                <div class="notification-detail-icon" id="notificationDetailIcon" aria-hidden="true"></div>
                <div class="notification-detail-category">
                <span class="notification-type" id="notificationDetailType"></span>
                <span class="notification-detail-kicker">Thông tin chi tiết</span>
              </div>
              <button class="icon-button" type="button" id="closeNotificationDetail" aria-label="Đóng">×</button>
              </div>
              <div class="notification-detail-content">
                <h3 id="notificationDetailTitle"></h3>
                <div class="notification-detail-message-panel">
                <span class="notification-detail-message-label">Nội dung thông báo</span>
                  <p class="notification-detail-message" id="notificationDetailMessage"></p>
                </div>
              </div>
              <div class="notification-detail-footer">
                <div class="notification-detail-time-block">
                <span class="notification-detail-time-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                </span>
                <span class="notification-detail-time-label">Thời gian nhận</span>
                <time class="notification-detail-time" id="notificationDetailTime"></time>
              </div>
              <button class="primary-button" type="button" id="dismissNotificationDetail">Đóng</button>
              </div>
            </section>
          </div>
        </div>
      </main>
